version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: aethercraft-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_ORIGINS=*
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    # Pull model on first start:
    # entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull gemma2:2b && wait"]

volumes:
  ollama-models:
