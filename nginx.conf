server {
    listen 80;
    server_name aethercraft.071098v2.duckdns.org;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy Ollama API via same domain (avoids Safari CORS issues)
    location /api/ai/ {
        proxy_pass https://ai.aethercraft.071098v2.duckdns.org/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # SPA fallback — all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebGPU / wasm workers need proper MIME types
    location ~* \.wasm$ {
        add_header Content-Type "application/wasm";
    }
    location ~* \.js$ {
        add_header Content-Type "application/javascript";
    }
}
